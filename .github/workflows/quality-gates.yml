name: Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Public Web and contracts
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_ZALO_URL: https://zalo.me/ci-placeholder
      NEXT_PUBLIC_API_URL: https://ci-api.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Check environment boundaries
        run: npm run security:env-boundaries

      - name: Lint
        run: npm run lint

      - name: Typecheck Public Web
        run: npm run typecheck

      - name: Typecheck workspaces
        run: npm run workspaces:typecheck

      - name: Build Public Web
        run: npm run build

      - name: Build Admin Portal
        run: npm run admin:build

  api:
    name: FastAPI and OpenAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test API
        run: python -m pytest

      - name: Export OpenAPI
        run: python scripts/export_openapi.py

      - name: Check OpenAPI artifact
        working-directory: .
        run: git diff --exit-code -- packages/api-spec/openapi.json
